[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/worker/Dockerfile"

[deploy]
startCommand = "pnpm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Mount a persistent volume at /data for the SQLite DB, screenshots,
# and the LinkedIn browser profile so they survive restarts/redeploys.
# Add the volume in Railway's UI: Settings → Volumes → +Volume → mount /data
