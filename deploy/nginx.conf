# Pookie reverse proxy. Replace `pookie.example.com` with your domain.
# After certbot --nginx runs, this file gets rewritten with TLS automatically.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Increase max body for resume uploads / large form payloads.
    client_max_body_size 10m;

    # Pass everything to the Next.js web app on :3000.
    # The web app itself proxies to the worker on 127.0.0.1:3001.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
